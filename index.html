</button><h2 id="infoTitle">使用说明</h2><p>选择图库类别、动作和视角，或直接搜索姿势名称。卡片下方可切换预览视角，点击图片查看大图。</p><p>大图中用 ← → 切换视角，↑ ↓ 切换姿势，Esc 返回。手机可左右滑动大图。按 / 开始搜索。</p><h3>素材与授权</h3><p>图片及原始数据归原作者ギア所有。镜像仓库的 LICENSE 声明素材不适用代码 MIT 许可且不得商用；原站页面与仓库对使用范围的表述存在差异，使用前请向权利人核实。</p><p>图库含成人向姿势分类。<a href="https://github.com/anhao/ai-pose-gallery-zh/blob/main/LICENSE" target="_blank" rel="noopener noreferrer">查看仓库许可</a></p></dialog>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const ANGLES = ['正面','俯视','仰视','侧面','斜侧'];
const SYSTEMS = [['','全部'],['全身单人・标准系','全身 · 标准'],['全身单人・性感系','全身 · 性感'],['上半身单人','上半身'],['双人缠绵','双人']];
const PAGE = 24;
const esc = x => String(x ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params = new URLSearchParams(location.search);
const state = {line:params.get('system')||'',category:params.get('category')||'',angle:params.get('angle')||'',query:params.get('q')||'',view:params.get('view')==='single'?'single':'pose',shown:PAGE};
let data=[],groups=[],list=[],searchTimer,returnFocus;
const viewerState={index:0,item:null,token:0};
const thumbnail = item => item.缩略图;
const miniThumbnail = item => item.缩略图;
const fullImage = item => item.原图;
const angleButtons = (group,item,viewer=false) => ANGLES.filter(a=>group.angles[a]).map(a=>`<button type="button" class="viewer-angle" data-angle="${esc(a)}" aria-label="切换到${esc(a)}" aria-pressed="${item.角度===a}"><img class="preview-thumb" data-pose-id="${esc(group.angles[a].id)}" src="${thumbnail(group.angles[a])}" alt=""><span>${esc(a)}</span></button>`).join('');
function saveURL(){const p=new URLSearchParams();for(const [key,val] of [['system',state.line],['category',state.category],['angle',state.angle],['q',state.query],['view',state.view==='single'?'single':'']])if(val)p.set(key,val);history.replaceState(null,'',location.pathname+(p.size?'?'+p:''));}
function categories(){const values=[...new Set(data.filter(x=>!state.line||x.体系===state.line).map(x=>x.分类))].sort((a,b)=>{const priority=['站姿','坐姿','坐位','立位','蹲姿','跪立','趴卧','侧卧位'];const ai=priority.indexOf(a),bi=priority.indexOf(b);return (ai<0?999:ai)-(bi<0?999:bi)||a.localeCompare(b,'zh-CN');});if(!values.includes(state.category))state.category='';$('#categorySelect').innerHTML='<option value="">全部动作</option>'+values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');$('#categoryOptions').innerHTML=values.map(v=>`<button type="button" data-category="${esc(v)}" aria-pressed="${v===state.category}">${esc(v||'全部动作')}</button>`).join('');requestAnimationFrame(fitFilters);}
function sync(){document.querySelectorAll('#categoryOptions button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.category===state.category));requestAnimationFrame(fitFilters);document.querySelectorAll('#lineTabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.line===state.line));document.querySelectorAll('#angleFilter button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.angle===state.angle));document.querySelectorAll('#viewFilter button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===state.view));$('#systemSelect').value=state.line;$('#categorySelect').value=state.category;$('#angleSelect').value=state.angle;$('#viewSelect').value=state.view;$('#searchClear').hidden=!$('#searchInput').value;}
function matches(item){return(!state.line||item.体系===state.line)&&(!state.category||item.分类===state.category)&&(!state.angle||item.角度===state.angle)&&(!state.query||state.query.toLowerCase().split(/\s+/).every(t=>item.search.includes(t)));}
function card(entry,index){const {item,group}=entry;return `<article class="pose-card" data-index="${index}"><button class="card-open" type="button" aria-label="查看${esc(group.name)}大图"><div class="card-image"><img class="main-image" src="${thumbnail(item)}" data-fallback="${esc(item.缩略图)}" width="300" height="400" loading="${index<6?'eager':'lazy'}" ${index===0?'fetchpriority="high"':''} decoding="async" alt="${esc(group.name)} · ${esc(item.角度)}"></div><div class="caption"><h2>${esc(group.name)}</h2><span class="category">${esc(item.分类)}</span></div></button>${state.view==='pose'?`<div class="card-controls" role="group" aria-label="${esc(group.name)}的预览视角">${ANGLES.filter(a=>group.angles[a]).map(a=>`<button type="button" class="preview-angle" data-angle="${esc(a)}" aria-label="预览${esc(a)}" aria-pressed="${a===item.角度}"><img class="preview-thumb" data-pose-id="${esc(group.angles[a].id)}" src="${miniThumbnail(group.angles[a])}" loading="lazy" decoding="async" alt=""><span>${esc(a)}</span></button>`).join('')}</div>`:''}</article>`;}
function render(append=false){if(!append){list=state.view==='single'?data.filter(matches).map(item=>({item,group:item.group})):groups.filter(g=>g.items.some(matches)).map(group=>({group,item:group.items.find(matches)}));state.shown=PAGE;$('#grid').innerHTML='';}const start=append?$('#grid').querySelectorAll('.pose-card').length:0;$('#grid').insertAdjacentHTML('beforeend',list.slice(start,state.shown).map((x,i)=>card(x,start+i)).join(''));if(!list.length)$('#grid').innerHTML='<div class="empty"><h2>没有找到匹配的姿势</h2><p>试试其他关键词，或减少筛选条件。</p><button id="emptyReset" type="button">清除筛选</button></div>';$('#resultCount').textContent=`找到 ${list.length} ${state.view==='pose'?'组姿势':'张参考图'}`;$('#loadMore').hidden=state.shown>=list.length;sync();saveURL();}
function reset(){clearTimeout(searchTimer);Object.assign(state,{line:'',category:'',angle:'',query:'',view:'pose'});$('#searchInput').value='';categories();render();}
function setSystem(value){clearTimeout(searchTimer);state.query=$('#searchInput').value.trim();state.line=value;state.category='';categories();render();}
$('#lineTabs').innerHTML=SYSTEMS.map(([value,label])=>`<button class="tab" type="button" data-line="${esc(value)}" aria-pressed="false">${label}</button>`).join('');$('#systemSelect').innerHTML=SYSTEMS.map(([value,label])=>`<option value="${esc(value)}">${label||'全部图库'}</option>`).join('');$('#angleFilter').innerHTML=ANGLES.map(a=>`<button type="button" data-angle="${a}" aria-pressed="false">${a||'全部视角'}</button>`).join('');$('#angleSelect').innerHTML=['',...ANGLES].map(a=>`<option value="${a}">${a||'全部视角'}</option>`).join('');$('#searchInput').value=state.query;
$('#categoryOptions').addEventListener('click',e=>{const b=e.target.closest('[data-category]');if(b){closeOptions(b);state.category=state.category===b.dataset.category?'':b.dataset.category;render();}});$('#lineTabs').addEventListener('click',e=>{const b=e.target.closest('[data-line]');if(b){closeOptions(b);setSystem(b.dataset.line);}});$('#systemSelect').addEventListener('change',e=>setSystem(e.target.value));$('#categorySelect').addEventListener('change',e=>{state.category=e.target.value;render();});$('#angleFilter').addEventListener('click',e=>{const b=e.target.closest('[data-angle]');if(b){closeOptions(b);state.angle=state.angle===b.dataset.angle?'':b.dataset.angle;render();}});$('#angleSelect').addEventListener('change',e=>{state.angle=e.target.value;render();});$('#viewFilter').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b){state.view=b.dataset.view;render();}});$('#viewSelect').addEventListener('change',e=>{state.view=e.target.value;render();});$('#searchInput').addEventListener('input',e=>{clearTimeout(searchTimer);$('#searchClear').hidden=!e.target.value;searchTimer=setTimeout(()=>{state.query=$('#searchInput').value.trim();render();},100);});$('#searchClear').addEventListener('click',()=>{clearTimeout(searchTimer);$('#searchInput').value='';state.query='';render();$('#searchInput').focus();});const loadObserver=new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting)&&state.shown<list.length){state.shown+=PAGE;render(true);}}, {rootMargin:'500px'});loadObserver.observe($('#loadMore'));
$('#grid').addEventListener('click',e=>{const button=e.target.closest('.preview-angle');if(!button)return;const card=button.closest('.pose-card'),entry=list[Number(card.dataset.index)];entry.item=entry.group.angles[button.dataset.angle];card.querySelectorAll('.preview-angle').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));const img=card.querySelector('.main-image');img.dataset.fallback=entry.item.缩略图;img.src=thumbnail(entry.item);img.alt=`${entry.group.name} · ${entry.item.角度}`;});
$('#grid').addEventListener('click',e=>{if(e.target.closest('#emptyReset')){reset();return;}const card=e.target.closest('.pose-card');if(!card||!e.target.closest('.card-open'))return;const index=Number(card.dataset.index),entry=list[index];viewerState.index=index;viewerState.item=entry.item;returnFocus=e.target.closest('.card-open');$('#viewer').showModal();showViewer();});
function showViewer(){const entry=list[viewerState.index],item=viewerState.item;const token=++viewerState.token;$('#viewerTitle').textContent=item.姿势名称;$('#viewerAngles').innerHTML=angleButtons(entry.group,item,true);if(window.POSE_HOST)window.POSE_HOST.queue();$('#copyStatus').textContent='';$('#downloadImage').href=item.原图;$('#downloadImage').download=`${item.id}.png`;const image=$('#viewerImage');image.src=thumbnail(item);image.alt=`${item.姿势名称} · ${item.角度}`;$('#imageStatus').hidden=false;$('#imageStatus').textContent='正在载入清晰图…';const full=new Image();full.decoding='async';full.onload=()=>{if(viewerState.token!==token)return;image.src=full.src;$('#imageStatus').hidden=true;};full.onerror=()=>{if(viewerState.token!==token)return;if(!full.src.endsWith('.png')){full.src=item.原图;return;}$('#imageStatus').textContent='图片加载失败，可重新打开或下载原图';};full.src=fullImage(item);}
function stepAngle(delta){const group=list[viewerState.index].group,items=ANGLES.map(a=>group.angles[a]).filter(Boolean),index=items.indexOf(viewerState.item);viewerState.item=items[(index+delta+items.length)%items.length];showViewer();}
function stepPose(delta){const index=viewerState.index+delta;if(index<0||index>=list.length)return;const angle=viewerState.item.角度;viewerState.index=index;viewerState.item=state.view==='single'?list[index].item:list[index].group.angles[angle]||list[index].item;showViewer();}
$('#viewerAngles').addEventListener('click',e=>{const b=e.target.closest('[data-angle]');if(b){viewerState.item=list[viewerState.index].group.angles[b.dataset.angle];showViewer();}});$('#viewerClose').addEventListener('click',()=>$('#viewer').close());$('#viewer').addEventListener('click',e=>{if(e.target===$('#viewer')){const r=$('#viewer').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#viewer').close();}});$('#viewer').addEventListener('close',()=>{viewerState.token++;$('#viewerImage').removeAttribute('src');returnFocus?.focus({preventScroll:true});});$('#anglePrev').addEventListener('click',()=>stepAngle(-1));$('#angleNext').addEventListener('click',()=>stepAngle(1));let touch;$('#viewerStage').addEventListener('touchstart',e=>{if(e.touches.length===1)touch={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});$('#viewerStage').addEventListener('touchend',e=>{if(!touch)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy))stepAngle(dx<0?1:-1);touch=null;},{passive:true});$('#viewerStage').addEventListener('touchcancel',()=>touch=null,{passive:true});document.addEventListener('keydown',e=>{if($('#viewer').open){if(['ArrowRight','ArrowLeft','ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();if(e.key==='ArrowRight')stepAngle(1);if(e.key==='ArrowLeft')stepAngle(-1);if(e.key==='ArrowDown')stepPose(1);if(e.key==='ArrowUp')stepPose(-1);}return;}if($('#infoDialog').open)return;if(e.key==='/'&&!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();$('#searchInput').focus();}});$('#infoClose').addEventListener('click',()=>$('#infoDialog').close());document.addEventListener('error',e=>{const img=e.target;if(img.tagName==='IMG'&&img.dataset.fallback){const fallback=img.dataset.fallback;delete img.dataset.fallback;img.src=fallback;}},true);
const filterAreas=[...document.querySelectorAll('.option-area')];
function closeOptions(button){const area=button.closest('.option-area');if(!area)return;area.classList.remove('expanded');const more=area.querySelector('.more');more.setAttribute('aria-expanded','false');more.querySelector('.more-label').textContent='更多'; }
function fitFilters(){for(const area of filterAreas){const list=area.querySelector('.chip-list'),more=area.querySelector('.more');if(!list||area.classList.contains('expanded'))continue;const buttons=[...list.children];buttons.forEach(b=>b.hidden=false);more.hidden=true;const room=area.clientWidth;let total=buttons.reduce((n,b)=>n+b.offsetWidth+6,0);if(total>room){more.hidden=false;let used=more.offsetWidth+22;for(const b of buttons){if(used+b.offsetWidth+6<=room){used+=b.offsetWidth+6;}else b.hidden=true;}const selected=buttons.find(b=>b.getAttribute('aria-pressed')==='true');if(selected?.hidden){const visible=buttons.filter(b=>!b.hidden);while(visible.length&&used+selected.offsetWidth+6>room){const last=visible.pop();last.hidden=true;used-=last.offsetWidth+6;}selected.hidden=false;}}}}
filterAreas.forEach(area=>area.querySelector('.more').addEventListener('click',e=>{const expanded=area.classList.toggle('expanded');e.currentTarget.setAttribute('aria-expanded',String(expanded));e.currentTarget.querySelector('.more-label').textContent=expanded?'收起':'更多'; if(expanded)area.querySelectorAll('.chip-list button').forEach(b=>b.hidden=false);else fitFilters();}));new ResizeObserver(fitFilters).observe(document.querySelector('.control-inner'));
$('#copyImage').addEventListener('click',async e=>{const b=e.currentTarget,id=viewerState.item.id;b.disabled=true;$('#copyStatus').textContent='正在复制图片…';try{if(window.POSE_HOST){await window.POSE_HOST.copyImage(id);}else{const blob=await (await fetch(viewerState.item.原图)).blob();await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);}$('#copyStatus').textContent='图片已复制到剪贴板';}catch(err){$('#copyStatus').textContent='复制失败，请重试或下载原图';}finally{b.disabled=false;}});
async function load(){try{const response=await fetch('data/pose-zh.json');if(!response.ok)throw Error('load');data=await response.json();const byGroup=new Map();for(const item of data){item.search=`${item.姿势名称} ${item.id} ${item.分类} ${item.体系} ${item.角度} ${item.姿势编号}`.toLowerCase();const key=`${item.体系}|${item.姿势编号}`;if(!byGroup.has(key))byGroup.set(key,{name:item.姿势名称,system:item.体系,items:[],angles:{}});item.group=byGroup.get(key);item.group.items.push(item);item.group.angles[item.角度]=item;}groups=[...byGroup.values()].sort((a,b)=>SYSTEMS.findIndex(x=>x[0]===a.system)-SYSTEMS.findIndex(x=>x[0]===b.system));if(!SYSTEMS.some(x=>x[0]===state.line))state.line='';if(!ANGLES.includes(state.angle))state.angle='';categories();render();}catch{ $('#grid').innerHTML='<div class="empty"><h2>暂时无法载入图库</h2><p>请重试，筛选条件会保留。</p><button id="retryLoad" type="button">重新加载</button></div>';$('#retryLoad').addEventListener('click',load);}}
load();
})();
</script>
</body>
</html>
